[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=40.8.0", "wheel"]

[tool.uv]
dev-dependencies = [
  "pytest>=6.0",
  "flake8",
  "black",
  "isort",
]
extra-index-url = [
  "https://pypi.org/simple/",
]
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple/"

[project]
authors = [
  {name = "Haomin Kong", email = "a645162@gmail.com"},
]
dependencies = [
  "urllib3<2",
  "requests>=2.20.0",
  "chardet>=3.0.0",
  "PyYaml>=5.1.0",
  "toml>=0.10.0",
  "loguru>=0.5.0",
]
description = "上海海事大学校园网自动认证工具"
dynamic = ["version"]
license = {text = "GPLv3"}
name = "shmtu-auth"
readme = "README.md"
requires-python = ">=3.8"

[project.urls]
Homepage = "https://github.com/a645162/shmtu-auth"

[project.scripts]
shmtu-auth = "shmtu_auth.main_start:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.dynamic]
version = {attr = "shmtu_auth.__version__"}

[project.optional-dependencies]
dev = [
  "pytest",
  "pylint",
  "flake8",
  "ruff",
  "pyinstaller",
  "setuptools",
  "wheel",
  "twine",
  "pillow",
  "pytz",
]
gui = [
  "PySide6",
  "PySideSix-Frameless-Window>=0.3.1",
  "darkdetect",
  "PySide6-Fluent-Widgets[full]",
]

[dependency-groups]
build = ["pyinstaller", "setuptools", "wheel", "twine"]
dev = [
  "pytest",
  "pylint",
  "flake8",
  "ruff",
  "pyinstaller",
  "setuptools",
  "wheel",
  "twine",
  "pillow",
  "pytz",
]
gui = [
  "PySide6",
  "PySideSix-Frameless-Window>=0.3.1",
  "darkdetect",
  "PySide6-Fluent-Widgets[full]",
]
lint = ["flake8", "ruff", "pylint"]
test = ["pytest", "pytest-cov"]
